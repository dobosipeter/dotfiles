set -g prefix C-b
set -g extended-keys on
set -g extended-keys-format csi-u
set -g history-limit 50000
set -g display-time 4000
set -g status-keys vi
set -g mode-keys vi
set -g mouse on
set -g focus-events on
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g pane-border-status off

# Vertical divider: panes side by side
bind v split-window -h -c "#{pane_current_path}"

# Horizontal divider: panes stacked
bind h split-window -v -c "#{pane_current_path}"

# Easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window

# Source .tmux.conf as suggested in `man tmux`
bind R source-file ~/.tmux.conf

# Sessionx stuff
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'false'
set -g @sessionx-layout 'reverse'
set -g @sessionx-zoxide-mode 'on'

# Delete with Ctrl+D; move preview scrolling to Alt+D to avoid a conflict.
set -g @sessionx-bind-kill-session 'ctrl-d'
set -g @sessionx-bind-scroll-down 'alt-d'

# Replace the long shortcut header with a compact footer.
set -g @sessionx-additional-options "--color pointer:9,spinner:92,marker:46 --bind 'start:hide-header' --footer 'Enter: open/create | Ctrl+R: rename | Ctrl+D: delete'"

# Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @plugin 'omerxx/tmux-sessionx'

run '~/.tmux/plugins/tpm/tpm'
